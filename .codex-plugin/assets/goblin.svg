<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="256" height="300" viewBox="500 440 980 1140"
     role="img" aria-labelledby="goblin-title goblin-desc">
  <!-- source-sha256:bb0229134968ba9b -->
  <title id="goblin-title">Goblin coding companion</title>
  <desc id="goblin-desc">A side-profile pixel goblin with a floppy hat, long nose, one black eye, small body, and brown satchel.</desc>

  <defs>
    <linearGradient id="hatGrad" x1="520" y1="455" x2="1370" y2="945" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#78ad55"/>
      <stop offset="45%" stop-color="#5f9843"/>
      <stop offset="100%" stop-color="#3d7431"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="640" y1="815" x2="1460" y2="1545" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c9ed59"/>
      <stop offset="55%" stop-color="#9dcb40"/>
      <stop offset="100%" stop-color="#81b838"/>
    </linearGradient>
    <linearGradient id="shortsGrad" x1="840" y1="1260" x2="1238" y2="1450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7a4b2f"/>
      <stop offset="100%" stop-color="#4a2f22"/>
    </linearGradient>

    <linearGradient id="goblin-satchel-gradient" x1="940" y1="1160" x2="1130" y2="1390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b98545"/>
      <stop offset="62%" stop-color="#765033"/>
      <stop offset="100%" stop-color="#4a2f22"/>
    </linearGradient>
  </defs>

  <g id="goblin-character" class="goblin-character" shape-rendering="crispEdges">
    <g class="goblin-outline" fill="#020403">
      <path d="M632 455 H925 V521 H1067 V584 H1198 V648 H1252 V716 H1315 V778 H1372 V910 H1300 V882 H984 V944 H918 V888 H678 V824 H776 V675 H703 V620 H626 V681 H528 V538 H632 Z"/>
      <path d="M642 812 H862 V878 H918 V942 H986 V885 H1305 V953 H1449 V1114 H1334 V1228 H1217 V1280 H1296 V1392 H1215 V1452 H1198 V1505 H1291 V1565 H1065 V1474 H958 V1565 H815 V1458 H742 V1382 H690 V1212 H767 V1124 H840 V1054 H778 V987 H714 V956 H642 Z"/>
      <path d="M834 1258 H1245 V1453 H1135 V1510 H970 V1453 H834 Z"/>
    </g>

    <g class="goblin-body">
      <path class="goblin-skin" fill="url(#skinGrad)"
          d="M671 837 H847 V891 H915 V953 H986 V891 H1280 V973 H1413 V1085 H1286 V1198 H1168 V1267 H1260 V1360 H1190 V1418 H858 V1418 H778 V1363 H724 V1228 H803 V1143 H865 V1055 H802 V1000 H738 V956 H671 Z"/>

      <rect class="goblin-satchel-shadow" x="1017" y="1300" width="44" height="38" fill="#3f281f" opacity="0.30"/>
    </g>

    <g class="goblin-clothes">
      <path fill="url(#shortsGrad)" d="M846 1305 L1234 1328 V1435 H847 Z"/>
      <path class="goblin-belt" fill="#b7863f" d="M865 1261 L1232 1278 V1328 L862 1308 Z" opacity="0.95"/>
      <path d="M846 1305 L1234 1328 V1435 H847 Z" fill="#3c281f" opacity="0.18"/>
